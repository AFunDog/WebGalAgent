# 浏览器录制配置

# 默认目标 URL
url: "http://localhost:3001/games/MyGO3.0.0/"

# 截图格式：jpeg（有损，小文件）或 png（无损，画质最好）
format: jpeg

# 截图质量：1-100，仅 JPEG 格式有效
quality: 80

# 录制帧率
fps: 60

# 默认录制时长（秒）
duration: 0

# changeScene 默认场景路径
scene_path: "index.txt"

# 页面模式：webgal / generic
page_mode: webgal

# 默认目标选择器
canvas_selector: "div._MainStage_main_9enex_1"

# 默认浏览器类型：chromium, firefox, webkit
browser_type: msedge

# 停止条件（JS 表达式，满足时提前终止录制）
stop_condition: "window.__webgal.sceneManager.sceneData.currentScene.sceneUrl === './game/scene/start.txt'"

# 是否录制 WebAudio 音频（Hook AudioNode.prototype.connect）
record_audio: true

# 是否将运行日志保存到输出视频旁边
save_logs: false

# 是否默认使用无头模式
headless: false

# 默认视口宽度
viewport_width: 1920

# 默认视口高度
viewport_height: 1080

# 游戏 IndexedDB 配置覆盖（通过 localforage 注入，在 changeScene 前生效）
game_config:
  "optionData.autoSpeed": 40
  "optionData.textSpeed": 50
