# Multi-Agent 默认配置

app:
  name: AgentWorkflow
  debug: false

# WebGal 游戏素材目录（绝对路径或相对于项目根目录）
# 只有 animation/background/bgm/figure 子目录会被扫描
assets:
  game_dir: D:\Program\WebGal_Terre\public\games\MyGO3.0.0\game

llm:
  provider: openai
  model: gpt-4o
  base_url: https://api.openai.com/v1
  temperature: 0.7
  max_tokens: 4096

memory:
  backend: in_memory
  max_messages: 100
